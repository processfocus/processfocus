type Mutation {
  """
  Complete the todo bound to an encrypted public todo token.
  Uses the embed tag because frontend route handlers call this with the frontend
  service-account JWT; the public token is validated inside the resolver.
  """
  completePublicTodo(token: String!, input: JSON): PublicTodo!
    @auth(tag: "embed")
  """
  Request a fresh public to-do link for a token-bound todo. Expired tokens are
  accepted only after token decryption succeeds; arbitrary todo IDs are not.
  """
  requestFreshPublicTodoLink(token: String!): PublicTodo! @auth(tag: "embed")
  """
  Submit the corrected recipient email for a Correction Required Public Completion Todo.
  Applies the process-authored correction rule and reissues the public invitation.
