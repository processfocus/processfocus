type Query {
  # Top level, either the Organisation or the Board if the organisation has one
  org: OrgUnit
  """
  Cedar authorization policies and schema.
  """
  cedarPolicies: CedarPolicies!
  # Return all organisation unit levels we have with the maximum depth we find them.
  # Results are sorted by maxDepth.
  # This allows for some better color coding.
  orgLevels: [OrgLevel!]!
  """
  Processes the current provider user is authorized to start.
  Pagination is applied after Cedar authorization.
  """
  processes(
    page: Int! = 1
    limit: Int! = 50
    processPath: String
    status: String
  ): ProcessListPage!
  """
  Todos the current provider user is authorized to complete.
  Pagination is applied after Cedar authorization.
  """
  todos(
    page: Int! = 1
    limit: Int! = 50
    processPath: String
    status: String
  ): TodoListPage!
  """
  Process Executions the current provider user is authorized to view.
  Pagination is applied after Cedar authorization.
  """
  executions(
    page: Int! = 1
    limit: Int! = 50
    processPath: String
    status: String
  ): ExecutionListPage!
  """
  The Process Execution with this id, when the current provider user may view it.
  A missing id and an id the caller may not view both return null.
  This is a single-row read. It does not page or scan execution history.
  """
  execution(id: ID!): Execution
  # Current logged-in provider user
  currentProviderUser: ProviderUser!
  """
  Get form metadata for a step. Returns null if step not found or user not authorized.
  The stepPath format is: "orgUnit/processName/stepName" (e.g., "finance/expense-report/Submit").
  When todoId is provided, state-referenced defaults are resolved against the process state.
  """
  formMetadata(stepPath: String!, todoId: ID): FormMetadata
  """
  Resolve the single-email correction form for a Correction Required Public Completion Todo.
  Uses default provider-user auth; the resolver checks correction-specific todo authorization.
  """
  publicCompletionCorrection(todoId: ID!): PublicCompletionCorrection
  """
  Resolve public todo status and form metadata from an encrypted public todo token.
  Uses the embed tag because frontend route handlers call this with the frontend
  service-account JWT; the public token is validated inside the resolver.
  """
  publicTodo(token: String!): PublicTodo! @auth(tag: "embed")
  """
  Resolve lookup suggestions for a public to-do form using its capability token.
  Only token-authorized public completion lookups are exposed by the resolver.
  """
  publicTodoLookupSuggestions(
    token: String!
    field: String!
    filter: String
    limit: Int
  ): [LookupItem!]! @auth(tag: "embed")
  """
  Resolve calendar slots for a public to-do form using its capability token.
  """
  publicTodoCalendarSlots(token: String!, field: String!): [CalendarSlotItem!]!
    @auth(tag: "embed")
  """
  Get workflow visualization data for a process by its path.
  Returns null if process not found.
  """
  processWorkflow(processPath: String!): ProcessWorkflow
  """
  Check if there are pending scheduled flows for a process execution.
  Returns true if there are jobs pending (not yet processed by job worker).
  Useful for polling to wait for background job completion in tests.
  """
  hasPendingScheduledFlows(processExecutionId: ID!): Boolean! @auth(tag: "ci")
  """
  Remint the public completion URL for a waiting Public Form without sending email.
  Uses the latest invitation attempt and current form expiry. Does not persist a token.
  """
  publicCompletionUrl(todoId: ID!): String! @auth(tag: "ci")
  """
  Paginated list of users with provider user status
  """
  allUsers(page: Int! = 1, limit: Int! = 20): SettingsUserPage!
    @auth(action: "administerUsers")
  """
  Paginated list of OAuth providers
  """
  allOAuthProviders(
    page: Int! = 1
    limit: Int! = 20
  ): SettingsOAuthProviderPage! @auth(action: "administerOAuthProviders")
  """
  Paginated Invited Users list. Defaults to pending invitations; pass status
  to inspect accepted or legacy-closed history.
  """
  allInvitations(
    page: Int! = 1
    limit: Int! = 20
    status: InvitationLifecycleStatus = PENDING
  ): SettingsInvitationPage! @auth(action: "administerUsers")
  """
  Get a single invitation by ID
  """
  invitationDetail(invitationId: ID!): SettingsInvitation
    @auth(action: "administerUsers")
  """
  Get detailed user information including provider user data
  """
  userDetail(userId: ID!): SettingsUserDetail @auth(action: "administerUsers")
  """
  Get notification preferences for a user.
  Returns default-off preferences (email: false) if no settings exist.
  """
  notificationPreferences(userId: ID!): NotificationPreferences!
    @auth(action: "administerUsers")
  """
  Paginated list of roles in the system
  """
  allRoles(page: Int! = 1, limit: Int! = 20): SettingsRolePage!
    @auth(action: "administerUsers")
  """
  Get the process state JSON for an execution (debugging feature).
  Returns null if execution not found.
  """
  processStateForExecution(executionId: ID!): JSON
    @auth(action: "showProcessState")
  """
  Discover which realtime transport clients should use for subscriptions.
  """
  subscriptionTransport: SubscriptionTransport!
  """
  Get lists that the current user has access to.
  Returns lists filtered by the user's roles.
  """
  availableLists: [ListInfo!]!
  """
  Returns stats views filtered by the user's roles.
  """
  availableStatsViews: [StatsViewInfo!]!
  """
  Get form metadata for editing a list item.
  Returns the client representation, JSON schema, and default values
  needed to render a dynamic form for the editable fields.
  Returns null if the list doesn't support editing or is not found.
  """
  listFormMetadata(listPath: String!): ListFormMetadata
  "Get an independent create form, gated by List view and create permission."
  listCreateFormMetadata(listPath: String!): ListCreateFormMetadata
  """
  Get lookup suggestions for a searchable select field within a form step.
  Returns matching items for the given filter text.
  """
  # Shared by embedded and authenticated forms; Cedar keeps provider-user access.
  lookupSuggestions(
    stepPath: String!
    field: String!
    filter: String
    limit: Int
    todoId: ID
  ): [LookupItem!]! @auth(tag: "embed")
  """
  Get calendar slots for a calendar slot field within a form step.
  """
  calendarSlots(
    stepPath: String!
    field: String!
    todoId: ID
  ): [CalendarSlotItem!]! @auth(tag: "embed")
  """
  Request a presigned URL for downloading a previously uploaded file.
  Returns a URL to GET the file from.
  Requires stepPath to verify the user can access this document store.
  """
  requestDownloadUrl(
    stepPath: String!
    documentStore: String!
    fileId: String!
  ): DownloadUrlResult!
}

