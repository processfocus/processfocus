"""
Invitation lifecycle outcome for Invited Users dashboard rows.
Deleted invitations are soft-deleted and excluded from ordinary lists.
"""
enum InvitationLifecycleStatus {
  PENDING
  ACCEPTED
  LEGACY_CLOSED
}

"""
Registration Link lifecycle for a pending Invitation.
Never exposes the bearer token, hash, or encrypted envelope.
"""
enum RegistrationLinkStatus {
  NOT_GENERATED
  ACTIVE
  EXPIRED
  REVOKED
}

type SettingsInvitation {
  id: ID!
  email: String!
  status: InvitationLifecycleStatus!
  roles: [Role!]!
  """
  When known, the time the Invitation was accepted.
  """
  acceptedAt: DateTimeISO
  """
  Human identity provider that accepted the Invitation, when known.
  """
  acceptedByProvider: String
  """
  Provider subject that accepted the Invitation, when known.
  """
  acceptedBySubject: String
  """
  Provider User created or matched at acceptance/legacy close, when known.
  """
  acceptedByProviderUserId: ID
  """
  When migration closed the Invitation against an existing Provider User.
  """
  legacyClosedAt: DateTimeISO
  """
  Why migration closed the Invitation without claiming historical acceptance.
  """
  legacyClosureReason: String
  """
  Registration Link status for passkey Invitation bootstrap.
  Accepted and legacy-closed invitations always report NOT_GENERATED.
  """
  registrationLinkStatus: RegistrationLinkStatus!
  """
  When the current or last live Registration Link expires / expired.
  """
  registrationLinkExpiresAt: DateTimeISO
  """
  Latest generation or rotation actor and time.
  """
  registrationLinkGeneratedAt: DateTimeISO
  registrationLinkGeneratedBy: String
  """
  Latest authorised reveal actor and time.
  """
  registrationLinkRevealedAt: DateTimeISO
  registrationLinkRevealedBy: String
  """
  Latest revocation actor and time.
  """
  registrationLinkRevokedAt: DateTimeISO
  registrationLinkRevokedBy: String
}

