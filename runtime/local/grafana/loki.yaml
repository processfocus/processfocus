auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://127.0.0.1:9093

pattern_ingester:
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false

# Directional business reporting, including filtered distinct DAU.
limits_config:
  retention_period: 744h
  split_instant_metric_queries_by_interval: 24h
  max_query_series: 10000
  max_global_streams_per_user: 20000
  reject_old_samples_max_age: 744h
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - pf_account_id
            - pf_account_name
            - pf_account_scope
            - pf_project
            - pf_environment
