SPECIFICATION OSpec
CONSTANTS
  Jobs = {1, 2}
  Supported = {1, 2}
  Observed = {1}
  Recycled = {2}
  MaxAttempts = 2
  InitialAttempts <- RetriedTarget
  LeaseTicks = 2
  DelayTicks = 0
  ExecutionTicks = 2
  GraceTicks = 1
  RestartTicks = 1
  NewestFirst = TRUE
  AttemptsFirst = TRUE
  AllowFailure = FALSE
  AllowHang = TRUE
  AllowCrash = FALSE
  AllowAckFailure = FALSE
INVARIANTS SupervisedTypeOK Accounted AtomicRetirement LiveFinalProtected BoundedCapacity ObservationTypeOK
PROPERTIES CapacityRecovered FinalRecovery ObservationProgress WaitingVisible
