SPECIFICATION OSpec
CONSTANTS
  Jobs = {1, 2}
  Supported = {1, 2}
  Observed = {1, 2}
  Recycled = {}
  MaxAttempts = 1
  InitialAttempts <- ZeroAttempts
  LeaseTicks = 2
  DelayTicks = 1
  ExecutionTicks = 2
  GraceTicks = 1
  RestartTicks = 1
  NewestFirst = TRUE
  AttemptsFirst = TRUE
  AllowFailure = TRUE
  AllowHang = TRUE
  AllowCrash = FALSE
  AllowAckFailure = FALSE
INVARIANTS SupervisedTypeOK Accounted AtomicRetirement LiveFinalProtected BoundedCapacity ObservationTypeOK
PROPERTIES CapacityRecovered FinalRecovery RecordedOutcomes ObservationProgress WaitingVisible
