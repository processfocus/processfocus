name: Public source CI

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: "true"
  NX_DAEMON: "false"
  NX_INTERACTIVE: "false"

jobs:
  checks:
    # This dedicated workflow is exported; the private monorepo has its own CI.
    if: github.repository != 'processfocus/monorepo'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check public workspace marker
        shell: bash
        run: test -f public-source.json

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: bun node usage http:tursodb

      # The filtered public export rewrites dependencies and excludes private actions.
      # See .github/actions/install-dependencies/README.md in the canonical repo.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and check public boundaries
        run: |
          bun run lint
          bun run lint:project-boundaries
          bun test scripts/check-project-boundaries.test.ts
          bun test scripts/public-source-snapshot.test.ts
          bun scripts/check-public-source.ts
          bun test scripts/public-release.test.ts
          bunx tsgo --ignoreConfig --noEmit --strict --skipLibCheck --moduleResolution bundler --module preserve --target es2024 --types bun scripts/public-release.ts scripts/public-release.test.ts scripts/check-public-source.ts tools/public-release/policy.ts

      - name: Verify public projects from the fresh checkout
        run: bun scripts/nx-quiet.ts run-many -t lint,typecheck,test,build,knip --parallel=2

      - name: Plan the fixed prerelease and inspect packed consumers
        run: bun scripts/public-release.ts dist/public-release

      - name: Retain release review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-release-${{ github.sha }}
          path: dist/public-release/
          if-no-files-found: error
          retention-days: 30
