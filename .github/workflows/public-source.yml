name: Public source CI

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: "true"
  NX_DAEMON: "false"
  NX_INTERACTIVE: "false"

jobs:
  checks:
    # This dedicated workflow is exported; the private monorepo has its own CI.
    if: github.repository != 'processfocus/monorepo'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read public workspace tool versions
        id: versions
        shell: bash
        run: |
          test -f public-source.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("mise.toml", "rb") as source:
              tools = tomllib.load(source)["tools"]
          for tool in ("bun", "node"):
              version = tools[tool]
              assert isinstance(version, str) and all(c in "0123456789." for c in version)
              print(f"{tool}={version}")
          PY

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.versions.outputs.bun }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and check public boundaries
        run: |
          bun run lint
          bun run lint:project-boundaries
          bun test scripts/check-project-boundaries.test.ts

      - name: Typecheck and test public projects
        run: bun scripts/nx-quiet.ts run-many -t typecheck,test --parallel=2
