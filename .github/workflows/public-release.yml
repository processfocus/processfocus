name: Public prerelease

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify OIDC without publishing, rehearse, or publish reviewed artifacts
        type: choice
        default: verify-oidc
        options: [verify-oidc, rehearse, publish]

permissions:
  contents: read

concurrency:
  group: public-prerelease
  cancel-in-progress: false

jobs:
  verify-trust:
    if: github.repository == 'processfocus/processfocus' && github.ref == 'refs/heads/trunk' && inputs.mode == 'verify-oidc'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm-next
    permissions:
      contents: read
      id-token: write
    env:
      NPM_PACKAGES: >-
        ["processfocus", "@processfocus/runtime", "@processfocus/runtime-local",
        "@processfocus/cli", "@processfocus/hosting-contract", "@processfocus/plugin-aws-lambda",
        "@processfocus/plugin-docker", "@processfocus/plugin-google-drive",
        "@processfocus/plugin-posthog", "@processfocus/plugin-resend"]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.2"
          package-manager-cache: false
      - name: Verify package-scoped npm OIDC exchanges without publishing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'npm:registry.npmjs.org');
          const identity = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            signal: AbortSignal.timeout(30_000),
          });
          assert(identity.ok, `GitHub OIDC request failed: HTTP ${identity.status}`);
          const { value } = await identity.json();
          assert(typeof value === 'string' && value.length > 0, 'Missing GitHub OIDC token');
          for (const name of JSON.parse(process.env.NPM_PACKAGES)) {
            const exchange = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(name)}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${value}` },
              signal: AbortSignal.timeout(30_000),
            });
            assert(exchange.ok, `npm exchange failed for ${name}: HTTP ${exchange.status}`);
            const { token } = await exchange.json();
            assert(typeof token === 'string' && token.length > 0, `Missing npm token for ${name}`);
            console.log(`OIDC exchange accepted for ${name}`);
          }
          NODE

  prepare:
    if: github.repository == 'processfocus/processfocus' && github.ref == 'refs/heads/trunk' && inputs.mode != 'verify-oidc'
    uses: ./.github/workflows/public-source.yml

  reviewed-artifacts:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Require owner approval and protected trunk. Solo-maintainer self-review is approved.
    environment: npm-next
    env:
      NPM_CONFIG_PROVENANCE: "true"
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, dependency install, build, or lifecycle scripts in this job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-release-${{ github.sha }}
          path: reviewed

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.2"
          package-manager-cache: false

      - name: Verify reviewed bytes and rehearse publication
        working-directory: reviewed
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.tgz' | wc -l)" -eq 10
          for package in ./*.tgz; do
            npm publish "$package" --dry-run --ignore-scripts --access public --tag next
          done

      - name: Reject already published versions before any publication
        if: inputs.mode == 'publish'
        working-directory: reviewed
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync('release.json', 'utf8'));
          assert.equal(receipt.sourceCommit, process.env.GITHUB_SHA);
          for (const { name, manifest } of receipt.packages) {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(manifest.version)}`, {
              signal: AbortSignal.timeout(30_000),
            });
            assert.equal(response.status, 404, `Refusing publication: ${name}@${manifest.version} already exists or registry check failed (${response.status})`);
          }
          NODE

      - name: Publish reviewed tarballs through npm trusted publishing
        if: inputs.mode == 'publish'
        working-directory: reviewed
        shell: bash
        run: |
          set -euo pipefail
          for package in ./*.tgz; do
            npm publish "$package" --ignore-scripts --access public --tag next --provenance
          done
