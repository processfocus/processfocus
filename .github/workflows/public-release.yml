name: Public prerelease review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-prerelease
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository != 'processfocus/monorepo' && github.ref == 'refs/heads/trunk'
    uses: ./.github/workflows/public-source.yml

  reviewed-artifacts:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure required reviewers, prevent self-review, and allow only trunk.
    environment: npm-next
    env:
      NPM_CONFIG_PROVENANCE: "true"
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, dependency install, build, or lifecycle scripts in this job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-release-${{ github.sha }}
          path: reviewed

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.2"
          package-manager-cache: false

      - name: Verify reviewed bytes and rehearse publication
        working-directory: reviewed
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.tgz' | wc -l)" -eq 10
          for package in ./*.tgz; do
            npm publish "$package" --dry-run --ignore-scripts --access public --tag next
          done
          # Publication intentionally unavailable in this issue. See docs/public-release.md.
